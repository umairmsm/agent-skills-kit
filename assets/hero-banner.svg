<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#0B0E16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E16"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#0B0E16"/>
    </linearGradient>
    <linearGradient id="forgeCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="symlinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#2D1503"/>
    </linearGradient>
    <linearGradient id="skillsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke: #2A3652; }
        50% { stroke: #F59E0B; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { r: 12px; opacity: 0.9; }
        100% { r: 34px; opacity: 0; }
      }
      .window-border { animation: pulseBorder 6s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: flowDash 2s linear infinite; }
      .radar-wave { animation: radarSweep 2.5s ease-out infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="1196" height="456" rx="12" fill="url(#bgGrad)" stroke="#2A3652" stroke-width="2" class="window-border"/>

  <!-- Terminal Window Chrome -->
  <path d="M 2 14 Q 2 2 14 2 L 1186 2 Q 1198 2 1198 14 L 1198 42 L 2 42 Z" fill="#141A28"/>
  <line x1="2" y1="42" x2="1198" y2="42" stroke="#2A3652" stroke-width="1.5"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="22" r="6" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6" fill="#10B981"/>

  <!-- Window Title -->
  <text x="50%" y="26" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="0.5">forge : universal-agent-context-engine.sh</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(1010, 13)">
    <rect width="164" height="20" rx="10" fill="#2D1503" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="12" cy="10" r="4" fill="#F59E0B"/>
    <text x="24" y="14" fill="#FDE68A" font-size="10.5" font-weight="700" letter-spacing="0.5">ZERO RULE DRIFT</text>
  </g>

  <!-- ==================== FLOW CONNECTOR LINES ==================== -->
  <!-- Left Inputs to Center -->
  <path d="M 350 220 L 460 220" stroke="#06B6D4" stroke-width="2.5" class="flow-line"/>
  <polygon points="462,220 452,215 452,225" fill="#06B6D4"/>
  <rect x="360" y="194" width="90" height="18" rx="4" fill="#0B0E16" stroke="#083344" stroke-width="1"/>
  <text x="405" y="206" text-anchor="middle" fill="#67E8F9" font-size="9" font-weight="600">STACK PROFILE</text>

  <!-- Center to Top Output (Symlinks) -->
  <path d="M 740 180 L 840 160" stroke="#F59E0B" stroke-width="2.5" class="flow-line"/>
  <polygon points="842,160 832,156 835,166" fill="#F59E0B"/>

  <!-- Center to Bottom Output (Skills) -->
  <path d="M 740 260 L 840 280" stroke="#10B981" stroke-width="2.5" class="flow-line"/>
  <polygon points="842,280 835,274 832,284" fill="#10B981"/>

  <!-- ==================== NODE 1: STACK PROFILES ==================== -->
  <g transform="translate(70, 80)">
    <rect width="280" height="290" rx="10" fill="url(#forgeCenterGrad)" stroke="#06B6D4" stroke-width="1.8"/>
