    <text x="18" y="26" fill="#22D3EE" font-size="11" font-weight="800" letter-spacing="1">INPUTS • STACK PROFILES</text>
    <rect x="210" y="12" width="55" height="18" rx="9" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <text x="237" y="24" text-anchor="middle" fill="#67E8F9" font-size="9" font-weight="600">PROFILES</text>

    <!-- Main Title -->
