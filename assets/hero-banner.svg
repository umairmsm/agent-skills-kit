    <text x="18" y="94" fill="#94A3B8" font-size="12">Instant Architecture Scaffolding</text>

    <!-- Profile Cards -->
    <g transform="translate(18, 115)" font-size="11.5" fill="#E2E8F0">
      <rect x="0" y="0" width="244" height="34" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
      <text x="12" y="22" fill="#60A5FA" font-weight="bold">⚡ Next.js + Tailwind</text>
      <text x="140" y="22" fill="#94A3B8" font-size="10.5">App Router + SSR</text>

      <rect x="0" y="42" width="244" height="34" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
      <text x="12" y="64" fill="#34D399" font-weight="bold">🐍 FastAPI + PostgreSQL</text>
      <text x="160" y="64" fill="#94A3B8" font-size="10.5">pgvector Ready</text>

      <rect x="0" y="84" width="244" height="34" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
      <text x="12" y="106" fill="#FBBF24" font-weight="bold">🚀 Astro + Static</text>
      <text x="140" y="106" fill="#94A3B8" font-size="10.5">High Performance</text>

      <rect x="0" y="126" width="244" height="34" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
      <text x="12" y="148" fill="#A78BFA" font-weight="bold">🖥️ Homelab Microservice</text>
      <text x="165" y="148" fill="#94A3B8" font-size="10.5">Docker/Compose</text>
    </g>
  </g>

