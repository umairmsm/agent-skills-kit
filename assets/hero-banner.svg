    <!-- Radar Wave for Live Doctor Scanning -->
    <circle cx="140" cy="52" r="14" fill="none" stroke="#FBBF24" stroke-width="2" class="radar-wave"/>
    <circle cx="140" cy="52" r="8" fill="#F59E0B"/>

    <text x="140" y="88" text-anchor="middle" fill="#FDE68A" font-size="10.5" font-weight="800" letter-spacing="1">FORGE CLI ENGINE</text>
    <text x="140" y="112" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">forge init</text>
    <text x="140" y="130" text-anchor="middle" fill="#FBBF24" font-size="11.5">Universal Agent Orchestrator</text>

    <!-- Checklist -->
    <g transform="translate(25, 150)" font-size="11.5" fill="#E2E8F0">
      <rect x="0" y="0" width="230" height="24" rx="4" fill="#2D1503" stroke="#78350F" stroke-width="1"/>
      <text x="10" y="16" fill="#FBBF24" font-weight="bold">✓</text>
      <text x="26" y="16">Zero Rule Drift (Single Source)</text>

      <rect x="0" y="30" width="230" height="24" rx="4" fill="#2D1503" stroke="#78350F" stroke-width="1"/>
      <text x="10" y="46" fill="#FBBF24" font-weight="bold">✓</text>
      <text x="26" y="46">forge doctor Hook Hygiene</text>

      <rect x="0" y="60" width="230" height="24" rx="4" fill="#2D1503" stroke="#78350F" stroke-width="1"/>
      <text x="10" y="76" fill="#FBBF24" font-weight="bold">✓</text>
      <text x="26" y="76">Session Persistence Leak Audit</text>

      <rect x="0" y="90" width="230" height="24" rx="4" fill="#2D1503" stroke="#78350F" stroke-width="1"/>
      <text x="10" y="106" fill="#FBBF24" font-weight="bold">✓</text>
      <text x="26" y="106">Zero-Message Transcript Pruning</text>
    </g>
  </g>

  <!-- ==================== NODE 3: OUTPUT BRANCHES ==================== -->
  <!-- Top Branch: Universal Symlinks -->
  <g transform="translate(840, 80)">
    <rect width="290" height="135" rx="10" fill="url(#symlinkGrad)" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="18" y="24" fill="#FDE68A" font-size="10.5" font-weight="800" letter-spacing="1">UNIVERSAL AGENT CONTRACTS</text>
    <text x="18" y="46" fill="#FFFFFF" font-size="15" font-weight="700">Symlink Network ⟷ AGENTS.md</text>
    
    <g transform="translate(18, 62)" font-size="10.5" fill="#E2E8F0">
      <rect x="0" y="0" width="118" height="22" rx="4" fill="#1F0E02" stroke="#78350F" stroke-width="1"/>
      <text x="8" y="15" fill="#60A5FA" font-weight="bold">CLAUDE.md</text>
      <text x="75" y="15" fill="#94A3B8">symlink</text>

      <rect x="126" y="0" width="118" height="22" rx="4" fill="#1F0E02" stroke="#78350F" stroke-width="1"/>
      <text x="8" y="15" fill="#34D399" font-weight="bold">GEMINI.md</text>
      <text x="75" y="15" fill="#94A3B8">symlink</text>

      <rect x="0" y="28" width="118" height="22" rx="4" fill="#1F0E02" stroke="#78350F" stroke-width="1"/>
      <text x="8" y="43" fill="#FBBF24" font-weight="bold">.cursorrules</text>
      <text x="75" y="43" fill="#94A3B8">symlink</text>

      <rect x="126" y="28" width="118" height="22" rx="4" fill="#1F0E02" stroke="#78350F" stroke-width="1"/>
      <text x="8" y="43" fill="#A78BFA" font-weight="bold">agent.md</text>
      <text x="75" y="43" fill="#94A3B8">symlink</text>
    </g>
  </g>

  <!-- Bottom Branch: Injected Skills -->
  <g transform="translate(840, 235)">
    <rect width="290" height="135" rx="10" fill="url(#skillsGrad)" stroke="#10B981" stroke-width="1.8"/>
    <text x="18" y="24" fill="#A7F3D0" font-size="10.5" font-weight="800" letter-spacing="1">CURATED PRODUCTION SKILLS</text>
    <text x="18" y="46" fill="#FFFFFF" font-size="15" font-weight="700">16 Injected Capabilities</text>

    <g transform="translate(18, 62)" font-size="10.5" fill="#E2E8F0">
      <rect x="0" y="0" width="124" height="22" rx="4" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <text x="8" y="15" fill="#6EE7B7">PostgreSQL &amp; pgvector</text>

      <rect x="132" y="0" width="120" height="22" rx="4" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <text x="8" y="15" fill="#6EE7B7">WCAG 2.2 Accessibility</text>

      <rect x="0" y="28" width="124" height="22" rx="4" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <text x="8" y="43" fill="#6EE7B7">Motion &amp; Keyframes</text>

      <rect x="132" y="28" width="120" height="22" rx="4" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <text x="8" y="43" fill="#6EE7B7">Performance Profiling</text>
    </g>
  </g>

  <!-- Bottom Proof Bar -->
  <rect x="70" y="388" width="1060" height="36" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
  <text x="50%" y="411" text-anchor="middle" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="0.4">
    <tspan fill="#F59E0B">●</tspan> SINGLE SOURCE OF TRUTH (AGENTS.MD)   |   
    <tspan fill="#10B981">●</tspan> 16 VERIFIED ENGINEERING SKILLS   |   
    <tspan fill="#3B82F6">●</tspan> ZERO RULE DRIFT   |   
    <tspan fill="#06B6D4">●</tspan> FORGE DOCTOR HYGIENE
  </text>
</svg>