name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax check
        run: |
          bash -n bin/forge

      - name: Run ShellCheck
        run: |
          shellcheck bin/forge

      - name: Verify CLI list command
        run: |
          ./bin/forge list

      - name: Verify profiles load without error
        run: |
          for p in profiles/*.profile; do
            echo "Checking $p..."
            bash -n "$p"
          done
